[project]
name = "ds-delo-semeinoe"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.162.0",
    "langgraph>=1.0,<2",
    "mcp>=2,<3",
    "openai>=3.39.0",
    "pydantic==2.13.5",
    "tzdata>=2026.5",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest==9.0.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
